name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Find website folder
        id: source
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ]; then
            echo "directory=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "Website package.json not found" >&2
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm ci
      - name: Build website
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.source.outputs.directory }}/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
